services:
  - type: web
    name: northstar-demo-bank-free
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: Northstar Demo Bank
      - key: BANKING_DEMO_OTP
        value: 246810
      - key: BANKING_SEED_DEMO
        value: "true"
      - key: BANKING_DATA_DIR
        value: /tmp/northstar-demo
